[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "steamos-tools"
version = "0.1.0"
description = "A unified Python tools platform for enhancing Arch-based SteamOS (Steam Deck) and Bazzite installs"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [{ name = "Michael DeGuzis" }]
dependencies = [
    "requests>=2.31",
    "tqdm>=4.66",
]

[project.urls]
Source = "https://github.com/mdeguzis/SteamOS-Tools"
"Bug Tracker" = "https://github.com/mdeguzis/SteamOS-Tools/issues"

[project.scripts]
steamos-tools = "steamostools.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["steamostools*"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "responses>=0.25",
]
